name: frontend
description: "A new Flutter project."
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  google_fonts: ^8.2.0
  flutter_secure_storage: ^10.3.1
  flutter_riverpod: ^2.6.1
  dio: ^5.11.0
  go_router: ^17.3.0
  freezed_annotation: ^3.1.0
